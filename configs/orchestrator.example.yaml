schema_version: 1

controller:
  bind: 127.0.0.1
  port: 8765
  state_dir: .miner-orchestrator
  poll_seconds: 60
  api_token_env: MINER_ORCHESTRATOR_API_TOKEN
  environment_allowlist:
    - MINING_QA_TOKEN
    - MINER_TEST_POOL_USER
    - MINER_TEST_POOL_PASSWORD

qa_status:
  enabled: false
  base_url: https://mining-qa-status.vercel.app
  token_env: MINING_QA_TOKEN

repositories:
  esp-miner:
    repository: bitaxeorg/ESP-Miner
    clone_url: https://github.com/bitaxeorg/ESP-Miner.git
    pushes:
      branches: [main, master]
    pull_requests:
      base_branches: [main, master]
      trusted_contributors: [replace-with-github-login]
    artifacts:
      firmware-ota:
        provider: github_actions
        workflow: build.yml
        artifact_name: esp-miner.bin
        filename: esp-miner.bin
        token_env: GITHUB_TOKEN
        wait_timeout: 1800
        poll_seconds: 15

test_modules:
  public-pool-smoke:
    pattern: test_public_pool_smoke.py
    device_types: [bitaxe_bonanza, bitaxe_602]
    required_interfaces: [api]
    timeout: 900

  stratum-v1-regression:
    pattern: test_stratum_v1_regression.py
    runner_profile: config.stratum.local.toml
    device_types: [bitaxe_bonanza, bitaxe_602]
    required_interfaces: [api]
    validation_pr: true
    timeout: 1200

lab:
  hosts:
    controller:
      transport: local
      miner_test: miner-test
      max_parallel: 1

    remote-usb-lab:
      transport: ssh
      ssh_target: mining-lab
      miner_test: /opt/miner-testcode/venv/bin/miner-test
      working_directory: /var/lib/miner-testcode
      work_root: /var/lib/miner-testcode/orchestrator
      max_parallel: 1

  devices:
    gamma-602:
      name: Bench Gamma 602
      type: bitaxe_602
      host: controller
      enabled: true
      addresses:
        api: http://bitaxe.local
      expected:
        board_version: "602"
      usb:
        serial_path: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_REPLACE-if00
        vendor_id: "303a"
        product_id: "1001"
        serial_number: REPLACE
        baudrate: 115200
      tags: [gamma, board-602, bitaxe]

  setups:
    gamma-local:
      host: controller
      platform_key: bitaxe-gamma-602
      runner_profile: config.local.toml
      runner_devices: [gamma-02]
      devices:
        miner: gamma-602

gates:
  firmware-smoke:
    name: ESP-Miner firmware smoke
    description: Build and exercise the normal hardware smoke and Stratum gates.
    repository: esp-miner
    triggers:
      pushes: true
      pull_requests: true
      schedules:
        - id: nightly
          cron: "17 3 * * *"
    changes:
      include: ["main/**", "components/**", "sdkconfig*"]
      exclude: ["doc/**"]
    test_modules: [public-pool-smoke, stratum-v1-regression]
    targets:
      setups: [gamma-local]
    deployment:
      method: esp_miner_http_ota
      artifact: firmware-ota
      device_roles: [miner]
      reboot_timeout: 180
    required: all
    timeout: 3600
